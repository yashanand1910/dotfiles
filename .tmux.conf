set-option -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-kitty:RGB'

set-option -sg escape-time 10
set-option -g focus-events on

# Kitty integration: graphics protocol passthrough (icat, image previews) and
# extended keyboard protocol (apps can distinguish ctrl+shift+key, ctrl+i vs tab, ...)
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features ',xterm-kitty:extkeys'

set -g renumber-windows on
set -g set-titles on
set -g set-titles-string '#S: #W'

# Remember which client (= kitty window) last displayed each session, so the
# long-command notification in .zshrc can focus the right kitty window even
# when the session is not currently visible on any client
set-hook -ga client-attached 'run-shell "tmux set-option -t \"#{session_name}\" @home_client \"#{client_name}\""'
set-hook -ga client-session-changed 'run-shell "tmux set-option -t \"#{session_name}\" @home_client \"#{client_name}\""'

set-window-option -g mode-keys vi

set -g mouse off

# For password manager autofill
# ~/.tmux.conf
bind -n M-p run-shell -b "tmux display-popup -E -w 60% -h 40% 'rbw-send #{pane_id}'"

# For new pane to open in same directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind -r p last-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Unbind keys
unbind Up     
unbind Down   
unbind Left   
unbind Right  
unbind-key -T copy-mode-vi C-b

# clipboard integration
set -s set-clipboard on
bind-key ] run "wl-paste | tmux load-buffer -; tmux paste-buffer -p"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'

# Fuzzy window picker (replaces choose-tree on prefix+w)
bind w display-popup -E -w 70% -h 60% tmux-window-picker

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

set -g @continuum-restore 'on'

# Programs to relaunch on session restore. NOTE: @resurrect-processes only
# APPENDS to resurrect's built-in list (vi/vim/nvim/less/htop/...), so vim
# would still restore. Overriding @resurrect-default-processes replaces the
# built-in list entirely — vim/nvim must never be restored.
set -g @resurrect-default-processes 'btop k9s lazydocker'

# Flag completion of the restore — scripts/tmux_boot polls this before
# attaching clients (attaching mid-restore gets yanked by switch-client)
set -g @resurrect-hook-post-restore-all 'tmux set-option -g @restore_complete 1'

# Undercurls fix (https://github.com/folke/tokyonight.nvim#fix-undercurls-in-tmux)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0]']'

# Theme
set -g @plugin 'jimeh/tmux-themepack'
set -g @themepack 'powerline/default/gray'
# set -g @plugin 'thesast/tmux-transient-status'
# set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin "janoamaral/tokyo-night-tmux"
# set -g @dracula-show-fahrenheit false
# set -g @dracula-show-left-icon session
# set -g @dracula-plugins "cpu-usage ram-usage time"
# set -g status-position top

set -g status off

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
