# vim:ft=kitty

## name: Tokyo Night (Bright)
## license: MIT
## author: Folke Lemaitre
## upstream: https://github.com/folke/tokyonight.nvim/raw/main/extras/kitty/tokyonight_night.conf
##
## Modified: upstream's normal ANSI slots are the muted base palette and the
## bright slots are already `util.brighten(normal)`. Since most output uses the
## normal slots, every normal slot was promoted to its brightened value and the
## bright slots pushed one gentler step further, so normal/bright stay distinct.
## Backgrounds are untouched. Mirrors the `on_colors` boost in nvim/lua/plugins.lua.

background #1a1b26
foreground #cfd8ff
selection_background #283457
selection_foreground #cfd8ff
url_color #32efd9
cursor #cfd8ff
cursor_text_color #1a1b26

# Tabs
active_tab_background #8db0ff
active_tab_foreground #16161e
inactive_tab_background #292e42
inactive_tab_foreground #545c7e
#tab_bar_background #15161e

# Windows
active_border_color #8db0ff
inactive_border_color #292e42

