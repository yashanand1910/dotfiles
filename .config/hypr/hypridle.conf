general {
    # no lock_cmd / hyprlock on purpose — screens off only (OLED burn-in protection)
    ignore_dbus_inhibit = false      # respect apps blocking idle (video players, etc.)
    ignore_systemd_inhibit = false
}

# 5 min idle -> all displays off; any input turns them back on
# (misc:key_press_enables_dpms is set in hyprland.lua)
# Under the Lua config `hyprctl dispatch X` evaluates X as Lua, so the old
# "dpms off" / "dpms on" strings are syntax errors and the screens never slept.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
