general {
    # no lock_cmd / hyprlock on purpose — screens off only (OLED burn-in protection)
    ignore_dbus_inhibit = false      # respect apps blocking idle (video players, etc.)
    ignore_systemd_inhibit = false
}

# 5 min idle -> all displays off. Waking is Hyprland's job, NOT hypridle's:
# misc:key_press_enables_dpms = true / mouse_move_enables_dpms = false (hyprland.lua)
# so a keypress wakes the screens and stray mouse motion does not.
#
# Deliberately NO on-resume. hypridle's resume fires on *any* input including
# mouse motion, so `on-resume = dpms on` overrode mouse_move_enables_dpms=false:
# a nudged mouse woke the screens, 5 min later this listener blanked them again,
# and the cycle repeated -> screens flapping on and off on their own.
#
# Under the Lua config `hyprctl dispatch X` evaluates X as Lua, so the old
# "dpms off" / "dpms on" strings are syntax errors and the screens never slept.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
}
